# $ per 1M tokens. Verified against the Anthropic pricing page and the claude-api skill
# model reference (cached 2026-10-06) on the run date (2026-10-17).
# claude-haiku-5-5 has two rate cards, chosen by prompt length:
#   <=100K tokens: $0.10 input / $0.50 output per MTok
#   >100K tokens:  $0.50 input / $2.50 output per MTok
# Cache: reads 0.1x the input rate, 5-minute writes 1.25x, 1-hour writes 2x.
models:
  claude-haiku-5-5:
    input_per_mtok: 0.10          # <=100K prompt (the tier this project stays in)
    input_per_mtok_long: 0.50     # >100K prompt
    output_per_mtok: 0.50
    output_per_mtok_long: 2.50
    cache_write_per_mtok: 0.125   # 1.25x base input
    cache_read_per_mtok: 0.01     # 0.1x base input
  claude-haiku-4-5:
    input_per_mtok: 1.00
    output_per_mtok: 5.00
    cache_write_per_mtok: 1.25
    cache_read_per_mtok: 0.10
  default:
    input_per_mtok: 0.10
    output_per_mtok: 0.50
    cache_write_per_mtok: 0.125
    cache_read_per_mtok: 0.01
