{% extends "base.html" %}{% block body %}
<h1>Source: {{ page }}</h1>
{% if snippet %}<p>Cited text: <code>{{ snippet }}</code></p>{% endif %}
{% if is_pdf %}<img alt="Source page" src="/source/{{ sid }}/page.png?page={{ page|urlencode }}&snippet={{ snippet|urlencode }}">
{% else %}<pre>{{ text }}</pre>{% endif %}
<p><a href="javascript:history.back()">Back</a></p>
{% endblock %}
